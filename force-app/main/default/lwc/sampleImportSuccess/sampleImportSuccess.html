<template>
    <div class="slds-card slds-p-around_large slds-text-align_center success-card">
        <lightning-icon icon-name="utility:success" variant="success" size="large"></lightning-icon>
        <h2 class="slds-text-heading_medium slds-m-top_medium">Sample Created</h2>
        <p class="slds-m-top_small slds-text-color_weak">
            <strong>{recordName}</strong> has been created from the TRF.
        </p>

        <div class="slds-m-top_medium">
            <lightning-button variant="brand" label="Open Sample" onclick={handleOpen} icon-name="utility:open" class="slds-m-right_small"></lightning-button>
            <lightning-button label="Import Another" onclick={handleImportAnother} icon-name="utility:refresh"></lightning-button>
        </div>
    </div>
</template>
