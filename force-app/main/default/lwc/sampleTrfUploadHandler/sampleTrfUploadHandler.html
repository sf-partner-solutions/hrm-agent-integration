<template>
    <div class="slds-card slds-p-around_medium upload-card">
        <h2 class="slds-text-heading_medium slds-text-align_center slds-m-bottom_x-small">
            <lightning-icon icon-name="utility:einstein" size="small" class="slds-m-right_x-small"></lightning-icon>
            Import Sample with AI
        </h2>
        <p class="slds-text-align_center slds-text-color_weak slds-m-bottom_medium">
            Upload a Test Request Form (TRF) PDF. Einstein will extract the patient and sample fields
            and let you review them before creating the Sample record.
        </p>

        <div if:false={hasUploadedFiles} class="slds-m-bottom_medium">
            <lightning-file-upload
                label="Select TRF PDF"
                name="trfUploader"
                accept={acceptedFormats}
                record-id={recordId}
                onuploadfinished={handleUploadFinished}
                onuploaderror={handleUploadError}>
            </lightning-file-upload>
        </div>

        <div if:true={hasUploadedFiles} class="slds-box slds-theme_shade">
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <div class="slds-col">
                    <lightning-icon icon-name="doctype:pdf" size="small" class="slds-m-right_small"></lightning-icon>
                    <span class="slds-text-body_regular">{uploadedFileName}</span>
                </div>
                <div class="slds-col_bump-left">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Remove"
                        onclick={handleRemove}
                        variant="bare">
                    </lightning-button-icon>
                </div>
            </div>
            <div class="slds-m-top_small">
                <template if:true={isProcessing}>
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-spinner alternative-text="Processing" size="small" variant="brand"></lightning-spinner>
                        <span class="slds-m-left_small slds-text-color_weak">Parsing TRF with Agentforce…</span>
                    </div>
                </template>
                <template if:false={isProcessing}>
                    <span class="slds-text-color_success">
                        <lightning-icon icon-name="utility:success" variant="success" size="x-small"></lightning-icon>
                        Uploaded
                    </span>
                </template>
            </div>
        </div>

        <p class="slds-text-body_small slds-text-color_weak slds-text-align_center slds-m-top_medium">
            Supported format: PDF. Files are stored in Salesforce Files (ContentDocument).
        </p>
    </div>
</template>
