<template>
    <div class="slds-card slds-p-around_medium preview-card">
        <header class="slds-grid slds-grid_align-spread slds-m-bottom_small">
            <h2 class="slds-text-heading_medium">
                <lightning-icon icon-name="utility:preview" size="small" class="slds-m-right_x-small"></lightning-icon>
                Review extracted Sample
            </h2>
            <template if:true={metadata.confidence_notes}>
                <span class="slds-text-color_weak slds-text-body_small">{metadata.confidence_notes}</span>
            </template>
        </header>

        <p class="slds-text-color_weak slds-m-bottom_medium">
            Einstein parsed <strong>{fileName}</strong>. Review and adjust the values, then click <em>Import</em> to create the Sample record.
        </p>

        <div class="slds-grid slds-gutters slds-wrap">
            <!-- Patient & TRF -->
            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                <h3 class="slds-text-heading_small section-heading">Patient &amp; TRF</h3>
                <lightning-input label="Patient Name" data-field="Patient_Name__c" value={sample.Patient_Name__c} onchange={handleFieldChange}></lightning-input>
                <lightning-input type="date" label="Patient DOB" data-field="Patient_DOB__c" value={sample.Patient_DOB__c} onchange={handleFieldChange}></lightning-input>
                <lightning-input label="Patient MRN" data-field="Patient_MRN__c" value={sample.Patient_MRN__c} onchange={handleFieldChange}></lightning-input>
                <lightning-combobox label="Patient Gender" data-field="Patient_Gender__c" value={sample.Patient_Gender__c} options={genderOptions} onchange={handleFieldChange}></lightning-combobox>
                <lightning-input label="Ordering Physician" data-field="Ordering_Physician__c" value={sample.Ordering_Physician__c} onchange={handleFieldChange}></lightning-input>
                <lightning-combobox label="Priority" data-field="Priority__c" value={sample.Priority__c} options={priorityOptions} onchange={handleFieldChange}></lightning-combobox>
            </div>

            <!-- Sample details -->
            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                <h3 class="slds-text-heading_small section-heading">Sample Details</h3>
                <lightning-input label="Customer Sample Name" data-field="Customer_Sample_Name__c" value={sample.Customer_Sample_Name__c} onchange={handleFieldChange}></lightning-input>
                <lightning-combobox label="Sample Type" data-field="Sample_Type__c" value={sample.Sample_Type__c} options={sampleTypeOptions} onchange={handleFieldChange}></lightning-combobox>
                <lightning-input type="date" label="Date of Collection" data-field="Date_of_Collection__c" value={sample.Date_of_Collection__c} onchange={handleFieldChange}></lightning-input>
                <lightning-input type="number" label="Number of Aliquots" data-field="Number_of_Aliquots__c" value={sample.Number_of_Aliquots__c} onchange={handleFieldChange}></lightning-input>
                <lightning-input type="number" step="0.01" label="Concentration (ng/uL)" data-field="Concentration__c" value={sample.Concentration__c} onchange={handleFieldChange}></lightning-input>
                <lightning-input type="checkbox" label="Frozen" data-field="Frozen__c" checked={sample.Frozen__c} onchange={handleFieldChange}></lightning-input>
            </div>

            <!-- Tests / Clinical -->
            <div class="slds-col slds-size_1-of-1 slds-p-around_x-small">
                <h3 class="slds-text-heading_small section-heading">Tests &amp; Clinical Notes</h3>
                <lightning-textarea label="Tests Requested" data-field="Tests_Requested__c" value={sample.Tests_Requested__c} onchange={handleFieldChange}></lightning-textarea>
                <lightning-textarea label="Clinical Notes" data-field="Clinical_Notes__c" value={sample.Clinical_Notes__c} onchange={handleFieldChange}></lightning-textarea>
            </div>
        </div>

        <footer class="slds-grid slds-grid_align-spread slds-m-top_medium">
            <div>
                <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
            </div>
            <div>
                <lightning-button
                    label="Review and Save"
                    icon-name="utility:edit"
                    onclick={handleReviewAndSave}
                    disabled={isSaving}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    variant="brand"
                    label="Quick Save"
                    icon-name="utility:upload"
                    onclick={handleImport}
                    disabled={isSaving}>
                </lightning-button>
            </div>
        </footer>

        <template if:true={isSaving}>
            <lightning-spinner alternative-text="Creating sample…" size="small"></lightning-spinner>
        </template>
    </div>
</template>
